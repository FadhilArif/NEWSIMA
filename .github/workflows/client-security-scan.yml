name: Client Security Scan

on:
  push:
    branches: ["main", "New-UI", "New-Proces", "SIMAWA-V2"]
  pull_request:
    branches: ["main", "New-UI", "New-Proces", "SIMAWA-V2"]

jobs:
  scan-client-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check client JavaScript syntax
        run: node --check app.js

      - name: Block Supabase secret keys in client files
        shell: bash
        run: |
          set -euo pipefail

          # Supabase Edge Functions are server-side code; service-key environment
          # variable names are expected there and must not be treated as client leaks.
          # Scan browser-accessible application files only.
          if grep -RInE 'sb_secret_|SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEYS|service_role' \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=supabase \
            --include='*.html' \
            --include='*.js' \
            --include='*.css' \
            --include='*.json' \
            --include='*.ts' \
            --include='*.tsx' \
            .; then
            echo "Potential Supabase secret/service-role material detected in client-accessible source."
            exit 1
          fi

          echo "Client secret scan passed."
