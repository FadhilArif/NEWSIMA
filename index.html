<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0B3AB5">
  <title>SIMA MHS</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] },
          colors: { sima: { 50:'#EEF4FF',100:'#E3ECFF',600:'#0B3AB5',700:'#092D8C' } }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="style.css?v=20261007-14">
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900">
  <section id="login" class="min-h-screen grid lg:grid-cols-2">
    <div class="hero bg-gradient-to-br from-[#172554] to-[#0B3AB5] text-white p-8 lg:p-12 flex flex-col justify-between">
      <b class="text-lg tracking-tight">SIMA MHS</b>
      <div>
        <h1 class="text-3xl lg:text-4xl font-extrabold leading-tight">Sistem Informasi dan Manajemen Organisasi Mahasiswa</h1>
        <p class="mt-3 text-white/80">BEM, HMJ, UKM, dan Club STIKes MHK</p>
      </div>
      <small class="text-white/70">© 2026 SIMA MHS</small>
    </div>
    <form class="box max-w-md w-full m-auto p-6 lg:p-8" id="fl">
      <div class="mb-7">
        <h2 class="text-2xl font-extrabold">Masuk ke akun Anda</h2>
        <p class="sub mt-1">Silakan masuk untuk mengakses SIMA MHS</p>
      </div>
      <label for="em">Email</label>
      <input id="em" type="email" placeholder="nama@stikesmhk.ac.id" required>
      <label for="pw">Kata sandi</label>
      <input id="pw" type="password" placeholder="Masukkan kata sandi" required>
      <p class="err" id="le" aria-live="polite"></p>
      <button class="btn full mt-5">Masuk</button>
    </form>
  </section>

  <div id="app" class="min-h-screen bg-slate-50 lg:grid lg:grid-cols-[240px_1fr]" hidden>
    <aside class="hidden lg:flex bg-white border-r border-slate-200 p-4 sticky top-0 h-screen flex-col">
      <div class="logo flex items-center gap-3 px-2 pb-5">
        <i class="w-9 h-9 rounded-xl bg-sima-600 block shrink-0"></i>
        <span>SIMA MHS</span>
      </div>
      <div id="nav" class="overflow-y-auto pr-1"></div>
    </aside>

    <main class="min-w-0 px-4 py-4 lg:px-7 lg:py-5 pb-24 lg:pb-8">
      <div class="top flex items-center gap-3 mb-5">
        <button id="backBtn" class="h-10 w-10 rounded-xl bg-white border border-slate-200 shadow-sm grid place-items-center hover:bg-slate-50 transition" aria-label="Kembali" title="Kembali" hidden></button>
        <label class="ctx flex items-center gap-2 rounded-xl bg-sima-50 px-3 py-2.5 min-w-0 max-w-full">
          <span class="text-slate-500 text-xs font-semibold shrink-0">Konteks</span>
          <select id="cx" aria-label="Ganti konteks" class="!w-auto min-w-0"></select>
        </label>
        <span class="sp flex-1"></span>

        <div class="relative" id="notifWrap">
          <button id="notifBtn" class="relative h-10 w-10 rounded-xl hover:bg-white border border-transparent hover:border-slate-200 grid place-items-center transition" aria-label="Notifikasi" title="Notifikasi"></button>
          <span id="notifBadge" class="absolute -top-0.5 -right-0.5 min-w-4 h-4 px-1 rounded-full bg-red-500 text-white text-[10px] font-bold grid place-items-center">0</span>
          <div id="notifPanel" class="absolute right-0 mt-2 w-[min(360px,calc(100vw-28px))] bg-white border border-slate-200 rounded-2xl shadow-xl overflow-hidden z-30" hidden></div>
        </div>

        <div class="relative" id="profileWrap">
          <button id="profileBtn" class="rounded-full focus:outline-none focus:ring-2 focus:ring-sima-600/30" aria-label="Profil akun" title="Profil akun">
            <span class="av block h-10 w-10" id="av"></span>
          </button>
          <div id="profileMenu" class="absolute right-0 mt-2 w-64 bg-white border border-slate-200 rounded-2xl shadow-xl overflow-hidden z-30" hidden></div>
        </div>
      </div>

      <div id="v"></div>
    </main>
    <nav class="bn lg:hidden fixed bottom-0 left-0 right-0 z-20 bg-white/95 backdrop-blur border-t border-slate-200 flex items-center justify-around px-2 py-2" id="bn"></nav>
  </div>

  <script src="config.js?v=20261007-14"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=20261007-26"></script>
</body>
</html>
